[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-intel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "yfinance>=0.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
ollama      = ["langchain-ollama>=0.2.0"]
groq        = ["langchain-groq>=0.2.0"]
claude      = ["langchain-anthropic>=0.3.0"]
openai      = ["langchain-openai>=0.2.0"]
duckduckgo  = ["duckduckgo-search>=6.0.0", "ddgs>=6.0.0"]
tavily      = ["tavily-python>=0.3.0"]
ui          = ["streamlit>=1.39.0"]
all         = [
    "langchain-ollama>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "duckduckgo-search>=6.0.0",
    "ddgs>=6.0.0",
    "tavily-python>=0.3.0",
    "streamlit>=1.39.0",
]

[tool.setuptools]
py-modules = ["main", "providers"]

[tool.setuptools.packages.find]
include = ["agents*", "graph*", "prompts*"]

[project.scripts]
swarm-intel = "main:main"
