[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-intel"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["main", "providers"]

[tool.setuptools.packages.find]
include = ["agents*", "graph*", "prompts*"]

[project.scripts]
swarm-intel = "main:main"
